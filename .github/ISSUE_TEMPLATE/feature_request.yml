name: Feature request
description: Suggest an idea or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: |
        penclone builds on research (see docs/decisions.md, "Evidence policy"). If you know a paper, standard, specification or
        measurement that supports the idea, link it here. Otherwise say so – it will be marked as an assumption.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
